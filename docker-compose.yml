version: '3.8'

services:
  php:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: todoandco_php
    volumes:
      - .:/var/www/html
    networks:
      - todoandco
    depends_on:
      - mysql

  nginx:
    image: nginx:alpine
    container_name: todoandco_nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - todoandco
    depends_on:
      - php

  mysql:
    image: mysql:8.0
    container_name: todoandco_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: todoandco_db
      MYSQL_USER: todoandco_user
      MYSQL_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - todoandco

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: todoandco_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8081:80"
    networks:
      - todoandco
    depends_on:
      - mysql

networks:
  todoandco:
    driver: bridge

volumes:
  mysql_data: